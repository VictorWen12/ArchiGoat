name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Stage site
        run: |
          install -d pages
          cp -R site/. pages/
          cp Logo.png pages/Logo.png
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
