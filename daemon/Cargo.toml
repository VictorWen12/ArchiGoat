# ArchiGoat transports Account Work to the user's native Agent CLI.
[package]
name = "archigoat"
version = "1.0.0"
edition = "2024"
publish = false

[build-dependencies]
winresource = "0.1.31"

[dependencies]
axum = "0.8"
base64 = "0.22"
getrandom = "0.4"
hmac = "0.12"
image = "0.25.5"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
url = "2"

[dev-dependencies]
# A check that measures the quiet between two runner generations owns its own clock.
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "archigoat"
path = "src/main.rs"

[[test]]
name = "blip_storm"
path = "../test/function/blip_storm.rs"

[[test]]
name = "reconnect_truth"
path = "../test/function/reconnect_truth.rs"

[[test]]
name = "runtime_boundary"
path = "../test/function/runtime_boundary.rs"

[[test]]
name = "runtime_process"
path = "../test/function/runtime_process.rs"
